    <style>
      #lader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
        background: linear-gradient(120deg, #e0e7ff, #ede9fe 40%, #fce7f3); background-size: 200% 200%;
        animation: lader-verlauf 6s ease infinite alternate; transition: opacity .55s ease, visibility .55s; }
      #lader.fertig { opacity: 0; visibility: hidden; }
      #lader.fertig .lader__mitte { transform: scale(1.06); }
      #lader span.b { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .7; animation: lader-blob 9s ease-in-out infinite alternate; }
      #lader span.b1 { background: radial-gradient(circle, rgba(99,102,241,.6), transparent 70%); top: -20vmax; left: -20vmax; }
      #lader span.b2 { background: radial-gradient(circle, rgba(236,72,153,.45), transparent 70%); bottom: -25vmax; right: -15vmax; animation-delay: -4s; }
      .lader__mitte { position: relative; display: grid; justify-items: center; gap: 1.1rem; transition: transform .55s ease; }
      .lader__logo { width: 4.5rem; height: auto; overflow: visible; }
      .lader__logo path { fill: url(#lader-g); fill-opacity: 0; stroke: #435DF8; stroke-width: 22; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: lader-zeichnen 1.1s cubic-bezier(.65,0,.35,1) forwards, lader-fuellen .5s ease .85s forwards, lader-atmen 2.2s ease-in-out 1.4s infinite; transform-origin: center; transform-box: fill-box; }
      .lader__text { margin: 0; font: 650 1rem/1.2 system-ui, sans-serif; letter-spacing: .02em; background: linear-gradient(90deg, #2563eb, #7c3aed);
        -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0; animation: lader-text .8s ease .5s forwards; }
      @keyframes lader-verlauf { to { background-position: 100% 50%; } }
      @keyframes lader-blob { to { transform: translate(10%, 8%) scale(1.08); } }
      @keyframes lader-zeichnen { to { stroke-dashoffset: 0; } }
      @keyframes lader-fuellen { to { fill-opacity: 1; stroke-opacity: 0; } }
      @keyframes lader-atmen { 50% { transform: scale(1.05); } }
      @keyframes lader-text { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      #lader.kurz .lader__logo path { animation: none; fill-opacity: 1; stroke-opacity: 0; }
      #lader.kurz .lader__text { animation: none; opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #lader, #lader span.b { animation: none; }
        .lader__logo path { animation: none !important; fill-opacity: 1; stroke-opacity: 0; }
        .lader__text { animation: none; opacity: 1; }
      }
      @media (prefers-color-scheme: dark) { #lader { background: linear-gradient(120deg, #0b1020, #1e1b4b 50%, #2a1530); background-size: 200% 200%; } }
